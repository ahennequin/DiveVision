[tool.poetry]
name = "divevision"
version = "0.1.0"
description = ""
authors = ["Alexandre <alexandredothennequin@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
torch = "^2.4.1"
numpy = "^2.1.2"
torchvision = "^0.19.1"
scikit-image = "^0.24.0"
tqdm = "^4.67.1"
fastapi = {extras = ["standard"], version = "^0.115.7"}
mlflow = "^2.20.0"
python-dotenv = "^1.0.1"
torchmetrics = "^1.6.2"
pytorch-msssim = "^1.0.0"
lightning = "^2.5.0.post0"
opencv-python = "^4.11.0.86"
omegaconf = "^2.3.0"
albumentations = "^2.0.5"
gdown = "^5.2.0"
supabase = "^2.11.0"
pillow = "11.0.0"
arq = "^0.26.3"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.29.5"
pytest = "^8.3.4"
black = "^24.10.0"
pytest-cov = "^6.0.0"
psycopg2 = "^2.9.10"
boto3 = "^1.37.3"
isort = "^6.0.1"
mypy = "^1.15.0"
bandit = "^1.8.3"

[tool.poetry.group.benchmark.dependencies]
psycopg2-binary = "^2.9.12"

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: needs a local Supabase stack; skipped unless SUPABASE_TEST_* is set",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
