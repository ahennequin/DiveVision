server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed bundles and assets never change once built.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A single-page app: every route (/photos/<id>, /account, ...) is index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
